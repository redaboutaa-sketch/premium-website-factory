# Validation sur pull request et sur la branche de travail. Aucune publication :
# ce workflow n'a besoin que de lire le dépôt. La publication sera un workflow
# séparé, déclenché sur release approuvée (incrément 5).
name: ci

on:
  pull_request:
  push:
    branches: [main, 'claude/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 26.x : référence de l'usine (.nvmrc). 24.x : compatibilité maintenue.
        node: ['26.13.1', '24.22.3']
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      FACTORY_SITE_DIR: examples/fixture-a-services
    steps:
      # actions/checkout v7.0.1 — SHA relevé par git ls-remote le 2026-11-24
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0 — SHA relevé par git ls-remote le 2026-11-24
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.20.0
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Prototypes sous CSP réelle (Chromium de la révision verrouillée)
        if: matrix.node == '26.13.1'
        run: |
          npx playwright install --with-deps chromium
          npm run shots:prototype
